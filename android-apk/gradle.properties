# Projeto EUNAMAN PCM
# Configurações otimizadas para Android Gradle Plugin 9.2.1+

android.useAndroidX=true
android.dependency.useConstraints=true

# R8 Full Mode (desativado para manter compatibilidade com regras Proguard antigas se necessário)
android.r8.strictFullModeForKeepRules=false

# Otimizações de performance recomendadas pelo Gradle
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
