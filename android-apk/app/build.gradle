apply plugin: 'com.android.application'

android {
    compileSdk 36
    namespace 'com.eunaman.pcm'

    signingConfigs {
        release {
            storeFile file('../eunaman.keystore')
            storePassword 'eunaman2024'
            keyAlias 'eunaman'
            keyPassword 'eunaman2024'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    defaultConfig {
        applicationId "com.eunaman.pcm"
        minSdk 21
        targetSdk 36
        versionCode 22
        versionName "1.5.12"
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Filtro para evitar conflitos de ABI
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.browser:browser:1.7.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    // ExifInterface para corrigir rotação das fotos tiradas pela câmera
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    // FileProvider (incluído no appcompat, mas declarado explicitamente)
    implementation 'androidx.core:core:1.12.0'
    // CameraX — câmera embutida DENTRO do próprio app (EunamanCameraActivity), no mesmo
    // processo da EunamanActivity. Substitui o antigo ACTION_IMAGE_CAPTURE (abria o app de
    // Câmera do sistema, um processo separado e pesado que fazia o Android encerrar o
    // EunamanActivity em segundo plano pra liberar memória em aparelhos com pouca RAM — ao
    // voltar, a WebView recarregava do zero). Mesmo processo = o Android não precisa matar
    // nosso app pra abrir "outro app" de câmera, porque não existe outro app envolvido.
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
}
