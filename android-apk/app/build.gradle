apply plugin: 'com.android.application'

android {
    compileSdk 34
    namespace 'com.eunaman.pcm'

    signingConfigs {
        release {
            storeFile file('../eunaman.keystore')
            storePassword 'eunaman2024'
            keyAlias 'eunaman'
            keyPassword 'eunaman2024'
        }
    }

    defaultConfig {
        applicationId "com.eunaman.pcm"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Filtro para evitar conflitos de ABI
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        def requested = details.requested
        if (requested.group == 'org.jetbrains.kotlin') {
            details.useVersion '1.8.22'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.browser:browser:1.7.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    // ExifInterface para corrigir rotação das fotos tiradas pela câmera
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    // FileProvider (incluído no appcompat, mas declarado explicitamente)
    implementation 'androidx.core:core:1.12.0'
}
